[project]
name = "multi-ai-agent-systems"
version = "1.0.0"
description = "Portfolio-grade multi-agent AI platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "pgvector>=0.3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "streamlit>=1.37.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0"
]

[project.optional-dependencies]
orchestration = [
  "langgraph>=0.2.0",
  "crewai>=0.55.0"
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.scripts]
multi-agents = "multi_ai_agent_systems.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
